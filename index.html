<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mitra 911">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Mitra 911 OnCall</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">

<style>
/* Layout: sidebar (laptop) / top bar + bottom nav (HP); navy klinis + hijau Mitra 911, angka TTV mono */
:root{
  --bg:#F5F7FC;--surface:#FFFFFF;--surface-2:#F6F8FC;--ink:#0D1A33;--muted:#5A6987;--line:#DBE2EF;
  --navy:#17398C;--navy-2:#0F2A6B;--navy-soft:#E5EBF9;--on-navy:#FFFFFF;
  --green:#15994A;--green-soft:#E1F4E8;
  --warn:#B77300;--warn-soft:#FFF1D6;--crit:#CF332C;--crit-soft:#FCE4E2;
  --shadow:0 1px 2px rgba(16,36,90,.06),0 8px 24px rgba(16,36,90,.07);
  --f-display:'Sora',system-ui,sans-serif;--f-body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;--f-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#09111F;--surface:#101B30;--surface-2:#0C1628;--ink:#E5EBF6;--muted:#8E9CB8;--line:#20304C;
  --navy:#6E93F2;--navy-2:#1A2F63;--navy-soft:#16264A;--on-navy:#0A1530;
  --green:#3CCB6E;--green-soft:#123222;--warn:#F2B64B;--warn-soft:#33270F;--crit:#FF6B63;--crit-soft:#3A1715;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#09111F;--surface:#101B30;--surface-2:#0C1628;--ink:#E5EBF6;--muted:#8E9CB8;--line:#20304C;
  --navy:#6E93F2;--navy-2:#1A2F63;--navy-soft:#16264A;--on-navy:#0A1530;
  --green:#3CCB6E;--green-soft:#123222;--warn:#F2B64B;--warn-soft:#33270F;--crit:#FF6B63;--crit-soft:#3A1715;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
:focus-visible{outline:2.5px solid var(--navy);outline-offset:2px;border-radius:6px}

/* shell */
.shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;height:100vh;background:var(--surface);color:var(--ink);border-right:1px solid var(--line);padding:20px 16px;display:flex;flex-direction:column;gap:20px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .logo{background:#fff;border-radius:10px;padding:6px 8px}}
:root[data-theme="dark"] .logo{background:#fff;border-radius:10px;padding:6px 8px}
.brand{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.logo{display:block;height:auto;width:200px;max-width:100%}
.appname{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--green);background:var(--green-soft);padding:3px 9px;border-radius:999px}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;gap:12px;padding:11px 12px;border:0;border-radius:10px;background:transparent;color:var(--muted);cursor:pointer;text-align:left;font-weight:600}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button.on{background:var(--navy-soft);color:var(--navy)}
.nav svg{width:20px;height:20px;flex:none}
.side .cta{margin-top:4px;background:var(--green);color:#fff;border:0;border-radius:12px;padding:12px;font-weight:700;display:flex;gap:8px;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 6px 16px rgba(21,153,74,.25)}
.side .cta:hover{filter:brightness(1.06)}
.side .foot{margin-top:auto;font-size:12px;color:var(--muted);line-height:1.5;background:var(--surface-2);border-radius:12px;padding:12px}
.side .foot b{color:var(--ink);font-weight:600}
.syncbox{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-size:12.5px;line-height:1.3}
.syncbox .st{flex:1;min-width:0;display:flex;flex-direction:column}.syncbox small{color:var(--muted);font-size:11.5px;overflow:hidden;text-overflow:ellipsis}
.sdot,.tsync{width:10px;height:10px;border-radius:50%;flex:none;background:var(--muted)}
.tsync{display:inline-block;cursor:pointer;border:0;padding:0;box-shadow:0 0 0 3px var(--surface-2)}
.ok .sdot,.tsync.ok{background:var(--green)}.wait .sdot,.tsync.wait{background:var(--warn)}.err .sdot,.tsync.err{background:var(--crit)}
.busy .sdot,.tsync.busy{background:var(--navy);animation:pulse 1s infinite}.off .sdot,.tsync.off{background:var(--line)}
.main{min-width:0;padding-block:24px 40px;padding-inline:28px}
.topbar,.bnav{display:none}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:20px}

@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .topbar{display:flex;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);color:var(--ink);padding:10px 16px;border-bottom:1px solid var(--line);box-shadow:0 2px 10px rgba(16,36,90,.05)}
  .topbar .logo{width:150px}
  .main{padding-block:16px 110px;padding-inline:16px}
  .bnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
  .bnav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);padding:6px 0;cursor:pointer}
  .bnav button.on{color:var(--navy)}
  .bnav svg{width:22px;height:22px}
  .bnav .fab{margin-top:-24px}
  .bnav .fab span.circ{width:54px;height:54px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;box-shadow:0 6px 18px rgba(21,153,74,.4)}
}

/* generic */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:18px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.xs{font-size:12px}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:9px 14px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--navy)}
.btn svg{width:18px;height:18px}
.btn.pri{background:var(--navy);border-color:var(--navy);color:var(--on-navy)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.go{background:var(--green);border-color:var(--green);color:#fff}
.btn.danger{color:var(--crit);border-color:color-mix(in srgb,var(--crit) 35%,var(--line))}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:9px}
.iconbtn{border:0;background:transparent;padding:6px;border-radius:8px;cursor:pointer;color:var(--muted);display:inline-grid;place-items:center}
.iconbtn:hover{background:var(--surface-2);color:var(--ink)}
.iconbtn svg{width:18px;height:18px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.pill.active{background:var(--green-soft);color:var(--green)}
.pill.active::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--green);animation:pulse 1.6s infinite}
.pill.done{background:var(--navy-soft);color:var(--navy)}
.pill.demo{background:var(--warn-soft);color:var(--warn)}
.pill.allergy{background:var(--crit-soft);color:var(--crit)}
.news{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:8px;font-size:12px;font-weight:700;font-family:var(--f-mono)}
.news.low{background:var(--green-soft);color:var(--green)}
.news.lowmed{background:var(--warn-soft);color:var(--warn)}
.news.med{background:var(--warn-soft);color:var(--warn)}
.news.high{background:var(--crit);color:#fff}
.news.na{background:var(--surface-2);color:var(--muted)}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* page head */
.phead{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap}
.phead h1{font-size:clamp(22px,3.2vw,30px);font-weight:700}
.phead p{margin:4px 0 0;color:var(--muted)}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.kpi{padding:16px 18px;display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden}
.kpi .v{font-family:var(--f-display);font-size:34px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.kpi .l{font-size:13px;color:var(--muted);font-weight:600}
.kpi.hero{background:linear-gradient(135deg,var(--navy-soft),var(--surface));border-color:color-mix(in srgb,var(--navy) 30%,var(--line));color:var(--navy)}
.kpi.hero .l{color:var(--navy);opacity:.85}
.kpi.alert .v{color:var(--crit)}
.kpi .ico{position:absolute;right:14px;top:14px;opacity:.18;width:34px;height:34px}
@media (max-width:860px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.kpi .v{font-size:28px}}

.dgrid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:1050px){.dgrid{grid-template-columns:minmax(0,1fr)}}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.sec-h h2{font-size:17px;font-weight:700}

/* active patient cards */
.acards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.acard{padding:16px;display:flex;flex-direction:column;gap:12px;cursor:pointer;transition:transform .15s,border-color .15s;border-left:4px solid var(--green)}
.acard:hover{transform:translateY(-2px);border-color:var(--navy)}
.acard.lvl-med,.acard.lvl-lowmed{border-left-color:var(--warn)}
.acard.lvl-high{border-left-color:var(--crit)}
.acard .nm{font-family:var(--f-display);font-weight:700;font-size:16px;line-height:1.25}
.acard .meta{font-size:12.5px;color:var(--muted)}
.vrow{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.vbox{background:var(--surface-2);border-radius:9px;padding:7px 8px}
.vbox .k{font-size:10.5px;font-weight:700;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.vbox .x{font-family:var(--f-mono);font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.vbox.w .x{color:var(--warn)}.vbox.c .x{color:var(--crit)}
.empty{padding:28px;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:10px}
.empty svg{width:44px;height:44px;opacity:.5}

/* lists */
.plist{display:flex;flex-direction:column}
.prow{display:grid;grid-template-columns:42px minmax(0,1.6fr) minmax(0,1fr) minmax(0,1fr) auto;align-items:center;gap:14px;padding:12px 16px;border-top:1px solid var(--line);cursor:pointer}
.prow:first-child{border-top:0}
.prow:hover{background:var(--surface-2)}
.avatar{width:42px;height:42px;border-radius:12px;background:var(--navy-soft);color:var(--navy);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:15px;position:relative}
.avatar .flag{position:absolute;right:-5px;bottom:-5px;font-size:15px;line-height:1}
.prow .t{font-weight:700}
.prow .s{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:760px){.prow{grid-template-columns:42px minmax(0,1fr) auto}.prow .hide-m{display:none}}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.search{flex:1;min-width:200px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:0 12px}
.search input{border:0;background:transparent;outline:0;padding:10px 0;width:100%}
.search svg{width:18px;height:18px;color:var(--muted)}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:7px 12px;border-radius:8px;font-weight:600;font-size:13px;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--navy);color:var(--on-navy)}

/* bars */
.bars{display:flex;flex-direction:column;gap:9px}
.bar{display:grid;grid-template-columns:minmax(0,1fr) 34px;gap:10px;align-items:center;font-size:13px}
.bar .tr{height:8px;border-radius:5px;background:var(--surface-2);overflow:hidden;margin-top:4px}
.bar .fi{height:100%;background:var(--navy);border-radius:5px}
.bar .n{font-family:var(--f-mono);font-weight:700;text-align:right}

/* detail */
.dhead{padding:20px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:18px;align-items:center}
.dhead .avatar{width:64px;height:64px;font-size:22px;border-radius:18px}
.dhead .avatar .flag{font-size:22px}
.dhead h1{font-size:clamp(20px,3vw,26px)}
.facts{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:6px;font-size:13.5px;color:var(--muted)}
.facts b{color:var(--ink);font-weight:600}
@media (max-width:760px){.dhead{grid-template-columns:auto minmax(0,1fr)}.dhead .acts{grid-column:1/-1}}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line)}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:transparent;padding:11px 14px;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;display:flex;gap:7px;align-items:center}
.tabs button.on{color:var(--navy);border-bottom-color:var(--navy)}
.tabs .cnt{font-family:var(--f-mono);font-size:11px;background:var(--surface-2);border-radius:6px;padding:1px 6px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media (max-width:860px){.two{grid-template-columns:minmax(0,1fr)}}
dl.kv{display:grid;grid-template-columns:150px minmax(0,1fr);gap:8px 14px;margin:0;font-size:14px}
dl.kv dt{color:var(--muted)}dl.kv dd{margin:0;font-weight:600;overflow-wrap:anywhere}
@media (max-width:500px){dl.kv{grid-template-columns:minmax(0,1fr)}dl.kv dt{margin-top:6px}}

/* timeline */
.tl{display:flex;flex-direction:column;position:relative}
.tl-item{display:grid;grid-template-columns:62px 22px minmax(0,1fr);gap:10px;padding-bottom:16px;position:relative}
.tl-item::before{content:"";position:absolute;left:83px;top:22px;bottom:0;width:2px;background:var(--line)}
.tl-item:last-child::before{display:none}
.tl-time{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);padding-top:2px;text-align:right}
.tl-dot{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--navy-soft);color:var(--navy);z-index:1}
.tl-dot svg{width:13px;height:13px}
.tl-dot.v{background:var(--green-soft);color:var(--green)}
.tl-dot.a{background:var(--warn-soft);color:var(--warn)}
.tl-body{background:var(--surface-2);border-radius:11px;padding:10px 12px;font-size:14px;min-width:0}
.tl-body .ttl{font-weight:700;font-size:13px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.tl-body p{margin:4px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}

/* vitals */
.monitor{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:14px 18px;background:var(--navy-soft);color:var(--ink);border:1px solid color-mix(in srgb,var(--navy) 25%,var(--line));border-radius:var(--r)}
.monitor .clock{color:var(--navy)}
.monitor.due .clock{color:#fff}
.monitor .clock{font-family:var(--f-mono);font-size:30px;font-weight:700;letter-spacing:.02em;font-variant-numeric:tabular-nums;min-width:110px}
.monitor.due{background:var(--crit);color:#fff;animation:pulse 1s infinite}
.monitor select{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:7px 10px;color:var(--ink)}
.monitor .btn{background:var(--surface)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer}
.chip.on{background:var(--navy);border-color:var(--navy);color:var(--on-navy)}
.chartbox{width:100%;overflow-x:auto}
.chartbox svg{display:block;width:100%;min-width:480px;height:auto}
.tblwrap{overflow-x:auto}
table.vt{width:100%;border-collapse:collapse;font-size:13.5px;min-width:760px}
table.vt th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);font-weight:700;white-space:nowrap}
table.vt td{padding:9px 10px;border-bottom:1px solid var(--line);font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
table.vt td.note{font-family:var(--f-body);white-space:normal;color:var(--muted);min-width:140px}
td.w{color:var(--warn);font-weight:700}td.c{color:var(--crit);font-weight:700}

/* form */
.form{display:flex;flex-direction:column;gap:16px}
.fsec{padding:18px;display:flex;flex-direction:column;gap:14px}
.fsec h3{font-size:15px;display:flex;gap:9px;align-items:center}
.fsec h3 .no{width:24px;height:24px;border-radius:7px;background:var(--navy);color:var(--on-navy);display:grid;place-items:center;font-size:12px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px 14px}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f.full{grid-column:1/-1}
.f label{font-size:12.5px;font-weight:700;color:var(--muted)}
.f label .req{color:var(--crit)}
.f input,.f select,.f textarea{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:0;min-width:0}
.f textarea{min-height:84px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--navy);background:var(--surface)}
.f input[readonly]{color:var(--muted);cursor:default}
.f .hint{font-size:11.5px;color:var(--muted)}
.vgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:560px){.vgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.vin{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;gap:2px}
.vin label{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between}
.vin input{border:0;background:transparent;outline:0;font-family:var(--f-mono);font-size:22px;font-weight:700;width:100%;padding:2px 0;min-width:0}
.vin.w{border-color:var(--warn)}.vin.c{border-color:var(--crit);background:var(--crit-soft)}
.vin .bp{display:flex;align-items:center;gap:4px}
.vin input::-webkit-outer-spin-button,.vin input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}.vin input[type=number]{-moz-appearance:textfield}
.vin .bp input{font-size:19px}
.vin .bp span{font-family:var(--f-mono);font-size:20px;color:var(--muted)}

/* sheet */
.overlay{position:fixed;inset:0;height:100%;height:100dvh;background:rgba(5,12,30,.55);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(3px)}
.sheet{background:var(--surface);border-radius:18px;width:min(640px,100%);max-height:calc(100% - 20px);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.sheet-h{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line)}
.sheet-h h2{font-size:17px}
.sheet>form{display:flex;flex-direction:column;flex:1 1 auto;min-height:0}
.sheet-h{flex:none}.sheet-f{flex:none;background:var(--surface)}
.sheet-b{padding:18px;overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:14px}
.sheet-f{padding:14px 18px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
@media (max-width:640px){.overlay{align-items:flex-end;padding:0}.sheet{border-radius:18px 18px 0 0;max-height:94%}.sheet-f{padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}}
.newsbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-radius:12px;background:var(--surface-2);font-size:13.5px}

.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;font-weight:600;z-index:90;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
@media (min-width:861px){.toast{bottom:28px}}

/* report */
.report{padding:28px;max-width:820px;margin:0 auto;width:100%}
.rep-h{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;border-bottom:3px solid var(--navy);padding-bottom:14px;flex-wrap:wrap}
.rep-logo{width:230px;max-width:60%;height:auto}
.rep-sec{margin-top:18px}
.rep-sec h3{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--navy);border-bottom:1px solid var(--line);padding-bottom:5px;margin-bottom:8px}
.rep-sec p{margin:4px 0;white-space:pre-wrap}
.sign{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:40px;text-align:center;font-size:13px}
.sign .ln{margin-top:56px;border-top:1px solid var(--ink);padding-top:4px;font-weight:700}
@media print{
  .side,.topbar,.bnav,.noprint{display:none!important}
  .shell{display:block}.main{padding:0}body{background:#fff}
  .card{box-shadow:none;border:0}
}

(()=>{

ongkok", "CN", "China", "Chinese"], ["Timor Leste", "TL", "Timor-Leste", "Timorese"], ["Turki", "TR", "Turkey", "Turkish"], ["Ukraina", "UA", "Ukraine", "Ukrainian"], ["Uni Emirat Arab", "AE", "the United Arab Emirates", "Emirati"], ["Vietnam", "VN", "Vietnam", "Vietnamese"], ["Yunani", "GR", "Greece", "Greek"]];

const COMPLAINTS=[["fever", "Fever", "Demam"], ["headache", "Headache", "Sakit kepala"], ["dizziness", "Dizziness", "Pusing"], ["weakness", "Generalized weakness", "Lemas"], ["fainting", "Fainting", "Pingsan"], ["nausea", "Nausea", "Mual"], ["vomiting", "Vomiting", "Muntah"], ["diarrhea", "Diarrhea", "Diare"], ["abdominal_pain", "Abdominal pain", "Nyeri perut"], ["constipation", "Constipation", "Sembelit"], ["dehydration", "Dehydration", "Dehidrasi"], ["cough", "Cough", "Batuk"], ["sore_throat", "Sore throat", "Nyeri tenggorokan"], ["runny_nose", "Runny nose", "Pilek"], ["sob", "Shortness of breath", "Sesak napas"], ["chest_pain", "Chest pain", "Nyeri dada"], ["palpitations", "Palpitations", "Berdebar-debar"], ["high_bp", "High blood pressure", "Tekanan darah tinggi"], ["back_pain", "Back pain", "Nyeri punggung"], ["joint_pain", "Joint pain", "Nyeri sendi"], ["muscle_pain", "Muscle pain", "Nyeri otot"], ["rash", "Skin rash", "Ruam kulit"], ["itching", "Itching", "Gatal"], ["allergy", "Allergic reaction", "Reaksi alergi"], ["insect_bite", "Insect bite / sting", "Gigitan / sengatan serangga"], ["animal_bite", "Animal bite / scratch", "Gigitan / cakaran hewan"], ["wound", "Wound / laceration", "Luka / luka robek"], ["sprain", "Sprain", "Keseleo"], ["fall", "Fall injury", "Cedera karena jatuh"], ["burn", "Burn", "Luka bakar"], ["sunburn", "Sunburn", "Kulit terbakar matahari"], ["toothache", "Toothache", "Sakit gigi"], ["ear_pain", "Ear pain", "Nyeri telinga"], ["eye_irritation", "Eye irritation / red eye", "Iritasi / mata merah"], ["dysuria", "Painful urination", "Nyeri saat BAK"], ["insomnia", "Insomnia", "Sulit tidur"], ["anxiety", "Anxiety", "Cemas"], ["intoxication", "Alcohol intoxication", "Mabuk alkohol"], ["motion_sickness", "Motion sickness", "Mabuk perjalanan"], ["jet_lag", "Jet lag", "Jet lag"], ["med_refill", "Medication refill", "Minta obat rutin"], ["fit_to_fly", "Fit-to-fly assessment", "Pemeriksaan fit to fly"]];
const cmpL=(k,lang)=>{const c=COMPLAINTS.find(x=>x[0]===k);return c?(lang==='id'?c[2]:c[1]):k};
const isNone=t=>/^\s*(-+|–|—|tidak ada|tdk ada|tidak|none|nil|no|disangkal|nka|nkda|n\/a)\s*\.?\s*$/i.test(String(t||''));
const natList=(a,lang)=>a.length<2?(a[0]||''):a.slice(0,-1).join(', ')+(lang==='id'?' dan ':' and ')+a[a.length-1];
const chiefLabel=p=>{const it=(p.complaint.items||[]).map(k=>cmpL(k,'en'));return [it.join(', '),p.complaint.chief].filter(Boolean).join(' — ')};
const flagOf=name=>{const c=COUNTRIES.find(x=>x[0].toLowerCase()===String(name||'').toLowerCase().trim());if(!c)return '';return String.fromCodePoint(...[...c[1]].map(ch=>127397+ch.charCodeAt(0)))};

const ACTIONS=['Pemeriksaan fisik','Pengukuran TTV','Pasang infus','Injeksi IV','Injeksi IM','Nebulisasi','Pemberian O₂','Perawatan luka','Hecting','Cek GDS','EKG','Pemberian obat oral','Kompres','Edukasi pasien','Persiapan rujukan','Pendampingan evakuasi'];
const OUTCOMES={hotel:'Rawat di hotel / perbaikan',rujuk:'Dirujuk ke RS',evak:'Evakuasi medis',tolak:'Menolak tindakan (APS)',lain:'Lainnya'};

/* ---------- NEWS2 ---------- */
const N2={rr:v=>v<=8?3:v<=11?1:v<=20?0:v<=24?2:3,spo2:v=>v<=91?3:v<=93?2:v<=95?1:0,sbp:v=>v<=90?3:v<=100?2:v<=110?1:v<=219?0:3,hr:v=>v<=40?3:v<=50?1:v<=90?0:v<=110?1:v<=130?2:3,temp:v=>v<=35?3:v<=36?1:v<=38?0:v<=39?1:2};
const LVL={low:'Rendah',lowmed:'Rendah–Sedang',med:'Sedang',high:'Tinggi'};
function news(v){if(!v)return null;let t=0,n=0,any3=false;for(const k in N2){if(isNum(v[k])){const s=N2[k](+v[k]);t+=s;n++;if(s===3)any3=true}}
  if(n===0)return null;if(v.o2)t+=2;if(v.avpu&&v.avpu!=='A'){t+=3;any3=true}
  return{total:t,level:t>=7?'high':t>=5?'med':any3?'lowmed':'low'}}
const cls=(k,v)=>{if(!isNum(v)||!N2[k])return '';const s=N2[k](+v);return s>=3?'c':s>=1?'w':''};
const newsChip=v=>{const n=news(v);return n?`<span class="news ${n.level}" title="Risiko ${LVL[n.level]}">NEWS ${n.total}</span>`:`<span class="news na">NEWS –</span>`};
const lastV=p=>p.vitals.length?[...p.vitals].sort((a,b)=>b.t-a.t)[0]:null;

/* ---------- store ---------- */
const KEY='mitra911_oncall_v1';
let DB={patients:[],settings:{doctor:'',nurse:'',theme:'light',resumeLang:'en',serverUrl:'',serverKey:'',deviceName:''}};
const load=()=>{try{const s=localStorage.getItem(KEY);if(s){DB=JSON.parse(s);DB.settings=Object.assign({doctor:'',nurse:'',theme:'light',resumeLang:'en',serverUrl:'',serverKey:'',deviceName:''},DB.settings||{});if(!DB.settings.v2){DB.settings.theme='light';DB.settings.v2=1}if(DB.settings.trUrl&&!DB.settings.serverUrl){DB.settings.serverUrl=DB.settings.trUrl;DB.settings.serverKey=DB.settings.trKey||''}delete DB.settings.trUrl;delete DB.settings.trKey;return true}}catch(e){}return false};
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){}};
const save=()=>{trackChanges();persist();scheduleSync()};
const getP=id=>DB.patients.find(p=>p.id===id);
/* ---------- sinkronisasi server (Google Spreadsheet) ---------- */
let SNAP=new Map();
const snapKey=p=>{const{updatedAt,...r}=p;return JSON.stringify(r)};
function buildSnap(){SNAP=new Map(DB.patients.filter(p=>!p.demo).map(p=>[p.id,snapKey(p)]))}
const SYNC={busy:false,err:'',timer:null};
const DEFAULT_SERVER='https://script.google.com/macros/s/AKfycbx5PRzgZBCRvnC2RWUwge4uHkmfJtuh42agbuxOXb-DHIy4XyQ15fQJRy5Xxd6E-dIlSA/exec';
const srv=()=>DB.settings.serverKey?((DB.settings.serverUrl||'').trim()||DEFAULT_SERVER):'';
function ensureSync(){DB.sync=Object.assign({lastSync:0,lastOk:0,dirty:[],tomb:[]},DB.sync||{})}
function markDirty(id){if(!DB.sync.dirty.includes(id))DB.sync.dirty.push(id)}
/* dipanggil di save(): cari pasien yang berubah / terhapus */
function trackChanges(){
  ensureSync();const now=Date.now(),seen=new Set();
  DB.patients.forEach(p=>{if(p.demo)return;seen.add(p.id);const k=snapKey(p);
    if(SNAP.get(p.id)!==k){p.updatedAt=now;markDirty(p.id);SNAP.set(p.id,snapKey(p))}});
  for(const id of [...SNAP.keys()])if(!seen.has(id)){SNAP.delete(id);DB.sync.dirty=DB.sync.dirty.filter(x=>x!==id);DB.sync.tomb.push({id,deleted:true,updatedAt:now})}
}
const pending=()=>(DB.sync?.dirty.length||0)+(DB.sync?.tomb.length||0);
async function api(body){
  const res=await fetch(srv(),{method:'POST',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({key:DB.settings.serverKey||''},body))});
  let j;try{j=await res.json()}catch(e){throw new Error('Jawaban server tidak terbaca. Pastikan deployment "Siapa saja"')}
  if(!j.ok)throw new Error(j.error||'Server menolak');return j;
}
function scheduleSync(ms=4000){if(!srv()||IN_FRAME)return;clearTimeout(SYNC.timer);SYNC.timer=setTimeout(()=>sync(false),ms)}
/* gabungkan versi lokal (belum terkirim) dengan versi server: entri TTV/advice/tindakan dari keduanya dipertahankan */
function mergeInto(loc,r){
  const del=new Set([...(loc.delIds||[]),...(r.delIds||[])]);
  const uni=(a,b)=>{const m=new Map();(b||[]).forEach(x=>x&&x.id&&m.set(x.id,x));(a||[]).forEach(x=>x&&x.id&&m.set(x.id,x));return [...m.values()].filter(x=>!del.has(x.id))};
  const before=snapKey(loc);
  loc.vitals=uni(loc.vitals,r.vitals);loc.advice=uni(loc.advice,r.advice);loc.actions=uni(loc.actions,r.actions);
  loc.en=Object.assign({},r.en||{},loc.en||{});loc.delIds=[...del];
  if(!loc.outcome&&r.outcome&&r.status==='selesai'&&(r.updatedAt||0)>(loc.createdAt||0)){loc.outcome=r.outcome;loc.status=r.status}
  if(!loc.resumeNote&&r.resumeNote)loc.resumeNote=r.resumeNote;
  return snapKey(loc)!==before;
}
function applyRemote(list){
  let changed=false;const dirty=new Set(DB.sync.dirty);
  (list||[]).forEach(r=>{
    if(!r||!r.id)return;
    const k=DB.patients.findIndex(p=>p.id===r.id),loc=DB.patients[k];
    if(dirty.has(r.id)){ if(loc&&!r.deleted&&mergeInto(loc,r)){loc.updatedAt=Math.max(Date.now(),(r.updatedAt||0)+1);SNAP.set(loc.id,snapKey(loc));changed=true} return }
    if(r.deleted){if(loc&&!loc.demo&&(loc.updatedAt||0)<=r.updatedAt){DB.patients.splice(k,1);SNAP.delete(r.id);changed=true}return}
    if(!loc){DB.patients.push(r);changed=true}
    else if((r.updatedAt||0)>=(loc.updatedAt||0)){if(snapKey(loc)!==snapKey(r)){for(const key of Object.keys(loc))delete loc[key];Object.assign(loc,r);changed=true}else loc.updatedAt=r.updatedAt}
    else return;
    SNAP.set(r.id,snapKey(r));
  });
  return changed;
}
async function sync(manual){
  if(!srv()||IN_FRAME||SYNC.busy)return;
  if(!navigator.onLine){SYNC.err='Offline';syncUI();if(manual)toast('Tidak ada internet — data aman di HP, akan dikirim saat online');return}
  ensureSync();SYNC.busy=true;SYNC.err='';syncUI();
  let changed=false,sentN=0,recvN=0;
  try{
    const dev=DB.settings.deviceName||'';
    // 1) ambil dulu perubahan dari server, gabungkan dengan isian lokal yang belum terkirim
    if(pending()){
      const j1=await api({action:'sync',since:DB.sync.lastSync,device:dev,changes:[]});
      changed=applyRemote(j1.patients)||changed;recvN+=(j1.patients||[]).length;
      DB.sync.lastSync=j1.serverTime;persist();
    }
    // 2) kirim versi gabungan + terima perubahan terbaru
    const dirtyIds=new Set(DB.sync.dirty),sent=DB.patients.filter(p=>dirtyIds.has(p.id)&&!p.demo).map(p=>JSON.parse(JSON.stringify(p)));
    const tombs=DB.sync.tomb.slice();
    const j=await api({action:'sync',since:DB.sync.lastSync,device:dev,changes:[...sent,...tombs]});
    const sentAt=new Map(sent.map(p=>[p.id,p.updatedAt]));
    DB.sync.dirty=DB.sync.dirty.filter(id=>{const p=getP(id);return !sentAt.has(id)||(p&&p.updatedAt!==sentAt.get(id))});
    DB.sync.tomb=DB.sync.tomb.filter(t=>!tombs.includes(t));
    changed=applyRemote(j.patients)||changed;sentN=j.applied||0;recvN+=(j.patients||[]).length;
    DB.sync.lastSync=j.serverTime;DB.sync.lastOk=Date.now();
    persist();
    if(manual)toast('Sinkron selesai · '+sentN+' terkirim, '+recvN+' diterima');
  }catch(err){SYNC.err=err.message==='Failed to fetch'?'Server tidak terjangkau':err.message;if(manual)toast('Sinkron gagal: '+SYNC.err)}
  SYNC.busy=false;
  const typing=document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if(changed&&!$('#ov')&&R.view!=='form'&&!typing)render();else syncUI();
  if(pending()&&!SYNC.err)scheduleSync(1500);
}
function syncLabel(){
  if(!srv())return{cls:'off',t:'Belum tersambung ke tim',s:'Isi kunci tim di Pengaturan'};
  if(IN_FRAME)return{cls:'off',t:'Mode pratinjau',s:'Sinkron aktif di aplikasi terpasang'};
  const n=pending();
  if(SYNC.busy)return{cls:'busy',t:'Menyinkron…',s:n?n+' perubahan dikirim':''};
  if(SYNC.err)return{cls:'err',t:SYNC.err==='Offline'?'Offline':'Gagal sinkron',s:(n?n+' perubahan menunggu · ':'')+(SYNC.err==='Offline'?'tersimpan di HP':SYNC.err)};
  if(n)return{cls:'wait',t:n+' perubahan menunggu',s:'Akan dikirim otomatis'};
  return{cls:'ok',t:'Tersinkron',s:DB.sync?.lastOk?ago(DB.sync.lastOk):''};
}
function syncUI(){
  const L=syncLabel();
  $$('.syncbox').forEach(el=>{el.className='syncbox '+L.cls;el.innerHTML=`<span class="sdot"></span><span class="st"><b>${esc(L.t)}</b>${L.s?`<small>${esc(L.s)}</small>`:''}</span>`+(srv()&&!IN_FRAME?`<button class="iconbtn" data-act="syncNow" aria-label="Sinkron sekarang" title="Sinkron sekarang">${ic('sync',16)}</button>`:'')});
  const d=$('#topSync');if(d){d.className='tsync '+L.cls;d.title=L.t+(L.s?' — '+L.s:'')}
}
async function pingServer(){
  const url=val('ssurl'),key=val('sskey');if(!key){toast('Isi kunci tim dulu');return}
  const old={u:DB.settings.serverUrl,k:DB.settings.serverKey};DB.settings.serverUrl=url;DB.settings.serverKey=key;DB.settings.deviceName=val('ssdev');
  try{const j=await api({action:'ping'});DB.settings.sheetUrl=j.sheetUrl||'';persist();toast('Tersambung ✓ '+j.patients+' pasien di spreadsheet');render()}catch(err){DB.settings.serverUrl=old.u;DB.settings.serverKey=old.k;toast('Belum tersambung: '+(err.message==='Failed to fetch'?'periksa internet / alamat server':err.message))}
}
function connectServer(){
  const was=!!srv(),url=val('ssurl'),key=val('sskey');
  DB.settings.serverUrl=url;DB.settings.serverKey=key;DB.settings.deviceName=val('ssdev');
  ensureSync();const on=!!srv();
  if(on&&!was){DB.patients.forEach(p=>{if(!p.demo){p.updatedAt=p.updatedAt||Date.now();markDirty(p.id)}});DB.sync.lastSync=0}
  persist();toast(on?'Tersimpan — menyambungkan ke spreadsheet tim':'Kunci dikosongkan — data hanya di perangkat');render();if(on)sync(true);
}
setInterval(()=>{if(document.visibilityState==='visible')sync(false)},5*60000);
setInterval(syncUI,30000);
window.addEventListener('online',()=>sync(false));
window.addEventListener('offline',()=>{SYNC.err='Offline';syncUI()});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&Date.now()-(DB.sync?.lastOk||0)>60000)sync(false)});

/* ---------- charts ---------- */
function spark(vals,w=110,h=30){
  vals=vals.filter(isNum).map(Number);if(vals.length<2)return '';
  const mn=Math.min(...vals),mx=Math.max(...vals),r=mx-mn||1;
  const pts=vals.map((v,i)=>[i/(vals.length-1)*(w-6)+3,h-3-(v-mn)/r*(h-6)]);
  const last=pts[pts.length-1];
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="var(--navy)" stroke-width="2" stroke-linejoin="round"/><circle cx="${last[0]}" cy="${last[1]}" r="3" fill="var(--navy)"/></svg>`;
}
const CK={hr:{l:'Nadi',u:'x/mnt',band:[51,90]},sbp:{l:'TD Sistolik',u:'mmHg',band:[111,219]},rr:{l:'Napas',u:'x/mnt',band:[12,20]},spo2:{l:'SpO₂',u:'%',band:[96,100]},temp:{l:'Suhu',u:'°C',band:[36.1,38]}};
function lineChart(vitals,key){
  const pts=vitals.filter(v=>isNum(v[key])).sort((a,b)=>a.t-b.t);
  if(pts.length===0)return `<div class="empty small">${ic('pulse')}Belum ada data ${CK[key].l}.</div>`;
  const W=760,H=240,L=46,Rr=16,T=16,B=34;
  const ys=pts.map(p=>+p[key]);const band=CK[key].band;
  let mn=Math.min(...ys,band[0]),mx=Math.max(...ys,key==='sbp'?Math.max(...ys,140):band[1]);
  if(key==='spo2'){mn=Math.min(...ys,88);mx=100}
  const span=(mx-mn)||1;mn-=span*.1;mx+=span*.1;
  const t0=pts[0].t,t1=pts[pts.length-1].t,ts=(t1-t0)||1;
  const X=t=>pts.length===1?L+(W-L-Rr)/2:L+(t-t0)/ts*(W-L-Rr);
  const Y=v=>T+(1-(v-mn)/(mx-mn))*(H-T-B);
  let g='';
  for(let i=0;i<=4;i++){const v=mn+(mx-mn)*i/4,y=Y(v);g+=`<line x1="${L}" x2="${W-Rr}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/><text x="${L-8}" y="${y+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="JetBrains Mono,monospace">${key==='temp'?v.toFixed(1):Math.round(v)}</text>`}
  const b0=Y(Math.min(band[1],mx)),b1=Y(Math.max(band[0],mn));
  const bandR=`<rect x="${L}" y="${b0}" width="${W-L-Rr}" height="${Math.max(0,b1-b0)}" fill="var(--green)" opacity=".09"/>`;
  const step=Math.max(1,Math.ceil(pts.length/7));
  const xl=pts.map((p,i)=>i%step===0||i===pts.length-1?`<text x="${X(p.t)}" y="${H-12}" text-anchor="middle" font-size="11" fill="var(--muted)" font-family="JetBrains Mono,monospace">${fTime(p.t)}</text>`:'').join('');
  const line=pts.map(p=>X(p.t)+','+Y(+p[key])).join(' ');
  const area=`${X(pts[0].t)},${H-B} ${line} ${X(pts[pts.length-1].t)},${H-B}`;
  const dots=pts.map((p,i)=>{const c=cls(key,p[key]);const col=c==='c'?'var(--crit)':c==='w'?'var(--warn)':'var(--navy)';const last=i===pts.length-1;
    return `<circle cx="${X(p.t)}" cy="${Y(+p[key])}" r="${last?5.5:4}" fill="${last?col:'var(--surface)'}" stroke="${col}" stroke-width="2.2"><title>${fTime(p.t)} — ${p[key]} ${CK[key].u}</title></circle>`}).join('');
  const lp=pts[pts.length-1];
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Grafik ${CK[key].l}">${bandR}${g}<polygon points="${area}" fill="var(--navy)" opacity=".07"/><polyline points="${line}" fill="none" stroke="var(--navy)" stroke-width="2.5" stroke-linejoin="round"/>${dots}${xl}<text x="${Math.min(X(lp.t),W-Rr-4)}" y="${Math.max(Y(+lp[key])-12,12)}" text-anchor="end" font-size="13" font-weight="700" fill="var(--ink)" font-family="JetBrains Mono,monospace">${lp[key]} ${CK[key].u}</text></svg>`;
}
function weekBars(){
  const days=[];const now=new Date();
  for(let i=6;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth(),now.getDate()-i);days.push({d,n:DB.patients.filter(p=>sameDay(p.createdAt,d)).length})}
  const mx=Math.max(1,...days.map(x=>x.n)),W=320,H=150,B=26,bw=28,gap=(W-bw*7)/8;
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img" aria-label="Kunjungan 7 hari">`+
   [0,.5,1].map(f=>`<line x1="0" x2="${W}" y1="${10+(1-f)*(H-B-10)}" y2="${10+(1-f)*(H-B-10)}" stroke="var(--line)"/>`).join('')+
   days.map((x,i)=>{const h=(x.n/mx)*(H-B-10),xx=gap+i*(bw+gap),y=H-B-h,today=i===6;
    return `<rect x="${xx}" y="${y}" width="${bw}" height="${Math.max(h,1)}" rx="6" fill="${today?'var(--green)':'var(--navy)'}" opacity="${x.n?1:.25}"/>`+(x.n?`<text x="${xx+bw/2}" y="${y-5}" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ink)" font-family="JetBrains Mono,monospace">${x.n}</text>`:'')+
     `<text x="${xx+bw/2}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--muted)">${x.d.toLocaleDateString('id-ID',{weekday:'short'})}</text>`}).join('')+`</svg>`;
}

    <div class="card kpi"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${I.check}</svg><div class="l">Selesai hari ini</div><div class="v">${today}</div></div>

    <div class="card kpi"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${I.users}</svg><div class="l">Total pasien</div><div class="v">${DB.patients.length}</div></div>
  </div>
  <div class="dgrid">
    <section>
      <div class="sec-h"><h2>Sedang ditangani</h2><span class="xs muted">Urut berdasarkan skor NEWS2</span></div>
      ${act.length?`<div class="acards">${act.map(p=>{const v=lastV(p),n=news(v);return `
        <article class="card acard lvl-${n?n.level:'na'}" data-open="${p.id}" tabindex="0">
          <div class="row between" style="align-items:flex-start;flex-wrap:nowrap"><div class="row" style="flex-wrap:nowrap;min-width:0">${avatar(p)}<div style="min-width:0"><div class="nm">${esc(p.identity.name)}</div><div class="meta">${esc(p.identity.nationality||'')} · ${esc(p.identity.hotel||'')} ${p.identity.room?'#'+esc(p.identity.room):''}</div></div></div>${newsChip(v)}</div>

function events(p){
  const ev=[];
  ev.push({t:p.createdAt,k:'s',ttl:'Pasien diterima',txt:chiefLabel(p)});
  p.vitals.forEach(v=>ev.push({t:v.t,k:'v',ttl:'TTV',txt:`TD ${v.sbp||'–'}/${v.dbp||'–'} · N ${v.hr||'–'} · RR ${v.rr||'–'} · S ${v.temp||'–'} · SpO₂ ${v.spo2||'–'}%${v.o2?' (O₂)':''}${v.note?'\n'+v.note:''}`,chip:newsChip(v)}));
  p.advice.forEach(x=>ev.push({t:x.t,k:'d',ttl:'Advice '+(x.doctor||'dokter'),txt:[x.dx&&('Dx: '+x.dx),x.rx&&('Terapi: '+x.rx),x.plan&&('Instruksi: '+x.plan)].filter(Boolean).join('\n')}));
  p.actions.forEach(x=>ev.push({t:x.t,k:'a',ttl:'Tindakan '+(x.nurse||'perawat'),txt:(x.items||[]).join(', ')+(x.detail?'\n'+x.detail:'')}));
  if(p.outcome)ev.push({t:p.outcome.t,k:'s',ttl:'Selesai — '+(OUTCOMES[p.outcome.type]||''),txt:[p.outcome.dest&&('Tujuan: '+p.outcome.dest),p.outcome.note].filter(Boolean).join('\n')});
  return ev.sort((a,b)=>b.t-a.t);
}

function tabRing(p){const v=lastV(p),c=p.complaint;

const GLOSS=[
 [/^\s*(tidak ada|tdk ada|tidak|disangkal|-)\s*\.?\s*$/i,'None'],[/\bmakan(?: dan| &)? minum sedikit\b/gi,'reduced oral intake'],[/\bnafsu makan (?:menurun|turun|berkurang)\b/gi,'decreased appetite'],[/\bBAB cair\b/gi,'watery stools'],[/\bBAB\b/g,'bowel movement'],[/\bBAK\b/g,'urination'],[/\blemas\b/gi,'weakness'],[/\bpusing\b/gi,'dizziness'],
 [/(\d),(\d)/g,'$1.$2'],[/\bIVFD\b/g,'IV fluid drip'],[/\bRL\b/g,"Ringer's lactate"],[/\bNaCl 0\.9 ?%/gi,'normal saline 0.9%'],[/\bD5 ?%?(?=\s|$|,)/g,'dextrose 5%'],
 [/\btpm\b/gi,'drops/min'],[/\blpm\b/gi,'L/min'],[/\bx\/mnt\b/gi,'per min'],[/\bAPS\b/g,'discharge against medical advice'],[/\bGDS\b/g,'random blood glucose'],
 [/\bTTV\b/g,'vital signs'],[/\bTD\b/g,'blood pressure'],[/\bKU\b/g,'general condition'],[/\bCM\b/g,'compos mentis'],[/\bkgBB\b/gi,'kg body weight'],
 [/\bSL\b/g,'sublingual'],[/\bISK\b/g,'urinary tract infection'],[/\bISPA\b/g,'acute respiratory infection'],[/\bGEA\b/g,'acute gastroenteritis'],[/\bDBD\b/g,'dengue hemorrhagic fever'],
 [/\bHT\b/g,'hypertension'],[/\bDM\b/g,'diabetes mellitus'],[/\bPPOK\b/g,'COPD'],[/\bSKA\b/g,'acute coronary syndrome'],[/\bIGD RS\b/g,'hospital emergency department'],[/\bguyur\b/gi,'as rapid bolus'],[/\bIGD\b/g,'emergency department'],[/\bRS\b/g,'hospital'],

];
const gloss=t=>GLOSS.reduce((s,[re,to])=>s.replace(re,to),String(t||''));

/* daftar teks bebas yang perlu diterjemahkan untuk satu pasien */
function trFields(p){
  const F=[],add=(key,label,src)=>{if(src&&String(src).trim())F.push({key,label,src:String(src)})};
  const i=p.identity,c=p.complaint;
  add('c.chief','Keterangan keluhan',c.chief);add('c.onset','Onset',c.onset);add('c.notes','Catatan keluhan',c.notes);
  add('i.history','Riwayat penyakit',i.history);add('i.meds','Obat rutin',i.meds);add('i.allergy','Alergi',i.allergy);add('i.lang','Bahasa',i.lang);
  p.advice.slice().sort((a,b)=>a.t-b.t).forEach(x=>{const w=fTime(x.t);add('adv.'+x.id+'.dx','Diagnosis '+w,x.dx);add('adv.'+x.id+'.rx','Terapi '+w,x.rx);add('adv.'+x.id+'.plan','Instruksi '+w,x.plan)});
  const custom=new Set();p.actions.forEach(x=>(x.items||[]).forEach(it=>{if(!ACT_EN[it])custom.add(it)}));
  custom.forEach(it=>add('item.'+it,'Tindakan lain',it));
  p.actions.slice().sort((a,b)=>a.t-b.t).forEach(x=>add('act.'+x.id+'.detail','Detail tindakan '+fTime(x.t),x.detail));
  if(p.outcome)add('out.note','Catatan akhir',p.outcome.note);
  add('resume.note','Catatan tambahan laporan',p.resumeNote);
  return F;
}
const trOk=(p,f)=>{const e=p.en&&p.en[f.key];return !!(e&&e.src===f.src&&e.en)};
function trGet(p,key,src){if(!src)return src;const e=p.en&&p.en[key];return e&&e.src===String(src)&&e.en?e.en:src}

let trBusy=false;
async function translatePatient(p,force){
  if(!srv()){toast('Isi dulu alamat server di Pengaturan → Server & sinkronisasi');return}
  p.en=p.en||{};
  const todo=trFields(p).filter(f=>{const e=p.en[f.key];if(!e||e.src!==f.src||!e.en)return true;return force&&!e.edited});
  if(!todo.length){toast('Semua teks sudah diterjemahkan');return}
  trBusy=true;render();
  try{
    const j=await api({action:'translate',source:'id',target:'en',texts:todo.map(f=>gloss(f.src))});
    todo.forEach((f,k)=>{p.en[f.key]={src:f.src,en:(j.translations[k]||'').trim(),edited:false}});
    save();toast(todo.length+' teks diterjemahkan — mohon periksa sebelum diekspor');
  }catch(err){toast('Terjemahan gagal: '+(err.message==='Failed to fetch'?'tidak ada koneksi atau alamat salah':err.message))}
  trBusy=false;render();
}
function trPanel(p){

     <div class="xs muted" style="white-space:pre-wrap">${esc(f.src)}</div>
     <textarea id="tr_${esc(f.key)}" data-trkey="${esc(f.key)}" rows="${Math.min(6,Math.max(2,f.src.split('\n').length+1))}" style="min-height:0" placeholder="Terjemahan bahasa Inggris">${esc(ok?e.en:'')}</textarea></div>`}).join('')}</div></details>`:''}
  </div>`;
}

const SERVER_CODE="/**\n * MITRA 911 ONCALL \u2014 Server Google Spreadsheet + Penerjemah otomatis\n * -------------------------------------------------------------------\n * Pasang skrip ini dari spreadsheet: Ekstensi > Apps Script.\n * 1) Ganti KUNCI di bawah dengan kata sandi tim (wajib).\n * 2) Jalankan fungsi \"setup\" sekali, izinkan akses.\n * 3) Terapkan > Deployment baru > Aplikasi web (Jalankan sebagai: Saya, Akses: Siapa saja).\n * 4) Tempel URL /exec dan KUNCI di aplikasi: Pengaturan > Server & sinkronisasi.\n */\nconst KUNCI = 'GANTI-KATA-SANDI-TIM';\nconst TZ = 'Asia/Jakarta';\n\nconst OUT = { hotel: 'Rawat di hotel / perbaikan', rujuk: 'Dirujuk ke RS', evak: 'Evakuasi medis', tolak: 'Menolak tindakan (APS)', lain: 'Lainnya' };\nconst DT = 'dd/MM/yyyy HH:mm';\nconst SHEETS = {\n  Pasien: [['ID', '@'], ['Server TS', '0'], ['Diperbarui (ms)', '0'], ['Status', '@'], ['Dihapus', '@'], ['Tgl Datang', DT], ['Nama', '@'], ['No. Paspor', '@'], ['Negara', '@'], ['JK', '@'], ['Usia', '0'], ['Hotel', '@'], ['Kamar', '@'], ['Telepon', '@'], ['Asuransi', '@'], ['Alergi', '@'], ['Keluhan Utama', '@'], ['Diagnosis', '@'], ['NEWS2 Terakhir', '0'], ['Hasil', '@'], ['Tujuan Rujukan', '@'], ['Waktu Selesai', DT], ['Dokter', '@'], ['Perawat', '@'], ['Diubah Oleh', '@'], ['JSON1', '@'], ['JSON2', '@'], ['JSON3', '@'], ['JSON4', '@']],\n  TTV: [['ID Pasien', '@'], ['Nama', '@'], ['No. Paspor', '@'], ['Waktu', DT], ['Sistolik', '0'], ['Diastolik', '0'], ['Nadi', '0'], ['RR', '0'], ['Suhu', '0.0'], ['SpO2', '0'], ['O2 Tambahan', '@'], ['AVPU', '@'], ['GDS', '0'], ['Nyeri', '0'], ['NEWS2', '0'], ['Catatan', '@'], ['ID TTV', '@']],\n  Advice: [['ID Pasien', '@'], ['Nama', '@'], ['Waktu', DT], ['Dokter', '@'], ['Diagnosis', '@'], ['Terapi', '@'], ['Instruksi', '@'], ['Tindak Lanjut', '@'], ['ID Advice', '@']],\n  Tindakan: [['ID Pasien', '@'], ['Nama', '@'], ['Waktu', DT], ['Perawat', '@'], ['Tindakan', '@'], ['Detail', '@'], ['ID Tindakan', '@']],\n  Log: [['Waktu', DT], ['Perangkat / Petugas', '@'], ['Aksi', '@'], ['Dikirim', '0'], ['Diterima', '0']]\n};\nconst P = name => SHEETS.Pasien.findIndex(h => h[0] === name); // 0-based\n\n/* ================= endpoint ================= */\nfunction doGet() { return out_({ ok: true, service: 'Mitra 911 OnCall server' }); }\n\nfunction doPost(e) {\n  let b;\n  try { b = JSON.parse((e.postData && e.postData.contents) || '{}'); } catch (x) { return out_({ ok: false, error: 'Format permintaan salah' }); }\n  if (!KUNCI || KUNCI === 'GANTI-KATA-SANDI-TIM') return out_({ ok: false, error: 'KUNCI di skrip belum diganti' });\n  if (b.key !== KUNCI) return out_({ ok: false, error: 'Kunci tidak cocok' });\n  const action = b.action || (b.texts ? 'translate' : 'ping');\n  try {\n    if (action === 'translate') return out_({ ok: true, translations: translate_(b) });\n    if (action === 'ping') {\n      const sh = sheet_('Pasien');\n      return out_({ ok: true, patients: Math.max(0, sh.getLastRow() - 1), sheetUrl: SpreadsheetApp.getActive().getUrl(), serverTime: Date.now() });\n    }\n    if (action === 'sync') return out_(sync_(b));\n    return out_({ ok: false, error: 'Aksi tidak dikenal' });\n  } catch (err) {\n    return out_({ ok: false, error: String((err && err.message) || err) });\n  }\n}\n\n/* ================= sinkronisasi ================= */\nfunction sync_(b) {\n  const lock = LockService.getScriptLock();\n  lock.waitLock(25000);\n  try {\n    const sh = sheet_('Pasien'), W = SHEETS.Pasien.length;\n    const now = Date.now(), dev = String(b.device || '').slice(0, 60);\n    const last = sh.getLastRow();\n    const idx = last > 1 ? sh.getRange(2, 1, last - 1, 3).getValues() : [];\n    const map = {};\n    idx.forEach((r, i) => { if (r[0]) map[r[0]] = { row: i + 2, ts: Number(r[1]) || 0, upd: Number(r[2]) || 0 }; });\n\n    const applied = [];\n    (b.changes || []).forEach(c => {\n      if (!c || !c.id) return;\n      const upd = Number(c.updatedAt) || 0, ex = map[c.id];\n      if (ex && upd < ex.upd) return;                       // versi server lebih baru\n      const row = c.deleted ? tombRow_(c, now, dev) : rowOf_(c, now, dev);\n      if (ex) { sh.getRange(ex.row, 1, 1, W).setValues([row]); ex.ts = now; ex.upd = upd; }\n      else { sh.appendRow(row); map[c.id] = { row: sh.getLastRow(), ts: now, upd: upd }; }\n      applied.push(c);\n    });\n    if (applied.length) rebuildChildren_(applied);\n\n    const since = Number(b.since) || 0, out = [];\n    const want = Object.keys(map).map(k => map[k]).filter(m => m.ts > since);\n    if (want.length) {\n      const data = sh.getRange(2, 1, sh.getLastRow() - 1, W).getValues();\n      const j = P('JSON1'), d = P('Dihapus');\n      want.forEach(m => {\n        const r = data[m.row - 2];\n        if (r[d] === 'YA') out.push({ id: r[0], deleted: true, updatedAt: Number(r[2]) || 0 });\n        else { try { out.push(JSON.parse(String(r[j]) + r[j + 1] + r[j + 2] + r[j + 3])); } catch (x) { } }\n      });\n    }\n    if (applied.length || out.length) log_(dev, 'sinkron', applied.length, out.length);\n    return { ok: true, serverTime: now, patients: out, applied: applied.length };\n  } finally {\n    lock.releaseLock();\n  }\n}\n\nfunction rowOf_(p, now, dev) {\n  const i = p.identity || {}, c = p.complaint || {}, o = p.outcome, t = p.team || {};\n  const vs = (p.vitals || []).slice().sort((a, b) => a.t - b.t), lv = vs[vs.length - 1];\n  const js = JSON.stringify(p);\n  if (js.length > 4 * 45000) throw new Error('Data pasien ' + (i.name || p.id) + ' terlalu besar');\n  const ch = [0, 1, 2, 3].map(k => js.substr(k * 45000, 45000));\n  return [p.id, now, Number(p.updatedAt) || now, p.status === 'aktif' ? 'Ditangani' : 'Selesai', '', d_(p.createdAt),\n    i.name || '', i.passport || '', i.nationality || '', i.sex || '', age_(i), i.hotel || '', i.room || '', i.phone || '',\n    i.insurance || '', i.allergy || '', c.summary || c.chief || '',\n    (p.advice || []).map(a => a.dx).filter(String).join('; '), lv ? news_(lv) : '', async function saveBlob(name,blob){
  const ios=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  if(ios&&navigator.canShare){try{const f=new File([blob],name,{type:blob.type});if(navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});return}}catch(e){if(e&&e.name==='AbortError')return}}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);
}
const b64bytes=d=>{const s=atob(d.split(',')[1]);const u=new Uint8Array(s.length);for(let k=0;k<s.length;k++)u[k]=s.charCodeAt(k);return u};

/* ---- minimal zip (store) ---- */
const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
const crc32=u=>{let c=0xFFFFFFFF;for(let k=0;k<u.length;k++)c=CRC[(c^u[k])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0};
function zip(files){
  const enc=new TextEncoder(),parts=[],cd=[];let off=0;
  const d=new Date(),dt=((d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1))&0xFFFF,dd=(((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate())&0xFFFF;
  for(const f of files){
    const nm=enc.encode(f.name),data=typeof f.data==='string'?enc.encode(f.data):f.data,crc=crc32(data);
    const h=new DataView(new ArrayBuffer(30));h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(8,0,true);h.setUint16(10,dt,true);h.setUint16(12,dd,true);h.setUint32(14,crc,true);h.setUint32(18,data.length,true);h.setUint32(22,data.length,true);h.setUint16(26,nm.length,true);h.setUint16(28,0,true);
    parts.push(new Uint8Array(h.buffer),nm,data);
    const c=new DataView(new ArrayBuffer(46));c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint16(10,0,true);c.setUint16(12,dt,true);c.setUint16(14,dd,true);c.setUint32(16,crc,true);c.setUint32(20,data.length,true);c.setUint32(24,data.length,true);c.setUint16(28,nm.length,true);c.setUint32(42,off,true);
    cd.push(new Uint8Array(c.buffer),nm);off+=30+nm.length+data.length;
  }
  const cdLen=cd.reduce((s,x)=>s+x.length,0);const e=new DataView(new ArrayBuffer(22));e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cdLen,true);e.setUint32(16,off,true);
  return new Blob([...parts,...cd,new Uint8Array(e.buffer)],{type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
}

  for(const s of R.sections){

    else if(s.table){const tot=s.widths.reduce((a,b)=>a+b,0),cw={};s.widths.forEach((w,k)=>cw[k]={cellWidth:w/tot*(W-2*M)});

  doc.setDrawColor(13,26,51);doc.setLineWidth(.3);doc.line(c1-30,y+28,c1+30,y+28);doc.line(c2-30,y+28,c2+30,y+28);
  doc.setFont('helvetica','bold');doc.text(T(R.doctor),c1,y+33,{align:'center'});doc.text(T(R.nurse),c2,y+33,{align:'center'});

function savePatient(e){e.preventDefault();
  const hsel=val('fhotelsel'),hotelV=hsel==='__other'?val('fhotel'):hsel;

  const nsel=val('fnatsel'),identity={name:val('fname'),passport:val('fpass').toUpperCase(),nationality:nsel==='__other'?val('fnat'):nsel,sex:val('fsex'),dob:val('fdob'),age:val('fage'),lang:val('flang'),allergy:val('fallergy'),hotel:hotelV,room:val('froom'),phone:val('fphone'),email:val('femail'),companion:val('fcomp'),insurance:val('fins'),history:val('fhist'),meds:val('fmeds')};
  if(!FORM.items.length&&!val('fchief')){toast('Pilih minimal satu keluhan atau isi keterangan');$('#fcsel').focus();return}
  const complaint={items:FORM.items.slice(),chief:val('fchief'),onset:val('fonset'),pain:val('fpain'),notes:val('fnotes')};
  complaint.summary=[complaint.items.map(k=>cmpL(k,'en')).join(', '),complaint.chief].filter(Boolean).join(' — ');
  const team={doctor:val('fdoc'),nurse:val('fnurse')};const t=fromLocalInput(val('fstart'));
  let p=R.id?getP(R.id):null;
  if(p){Object.assign(p,{identity,complaint,team,createdAt:t});toast('Perubahan tersimpan')}
  else{p={id:uid(),createdAt:t,status:'aktif',identity,complaint,team,vitals:[],advice:[],actions:[],outcome:null};DB.patients.push(p);toast('Pasien ditambahkan — silakan input TTV pertama')}
  save();go('detail',{id:p.id,tab:'ring'});
}

/* ---------- monitor timer ---------- */
const MON={id:null,int:15,next:0,due:false};
let audioCtx=null;
const beep=()=>{try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=880;g.gain.value=.12;o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+.25)}catch(e){}try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}};
const fmtCount=()=>{const s=Math.round((MON.next-Date.now())/1000);const a=Math.abs(s);return (s<0?'+':'')+pad(Math.floor(a/60))+':'+pad(a%60)};
function stopMon(){MON.id=null;MON.due=false}
setInterval(()=>{
  if(MON.id){const c=$('#monclock');if(c)c.textContent=fmtCount();
    if(!MON.due&&Date.now()>=MON.next){MON.due=true;beep();const b=$('#monbar');b&&b.classList.add('due');const p=getP(MON.id);toast('Waktunya cek TTV: '+(p?p.identity.name:''))}
    else if(MON.due&&Math.round((Date.now()-MON.next)/1000)%30===0)beep()}
},1000);
setInterval(()=>{$$('[data-since]').forEach(e=>e.textContent=dur(Date.now()-+e.dataset.since));$$('[data-ago]').forEach(e=>e.textContent=ago(+e.dataset.ago))},30000);

/* ---------- export ---------- */
function download(name,text,type){const b=new Blob([text],{type});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
function csv(){const h=['Waktu datang','Nama','Paspor','Negara','JK','Usia','Hotel','Kamar','Telepon','Asuransi','Alergi','Keluhan','Diagnosis','Jumlah TTV','NEWS2 terakhir','Tindakan','Status','Hasil','Tujuan','Waktu selesai','Dokter','Perawat'];
  const q=s=>'"'+String(s??'').replace(/"/g,'""')+'"';
  const rows=DB.patients.map(p=>{const v=lastV(p);return [fDT(p.createdAt),p.identity.name,p.identity.passport,p.identity.nationality,p.identity.sex,ageOf(p),p.identity.hotel,p.identity.room,p.identity.phone,p.identity.insurance,p.identity.allergy,chiefLabel(p),p.advice.map(a=>a.dx).filter(Boolean).join('; '),p.vitals.length,news(v)?.total??'',p.actions.flatMap(a=>a.items||[]).join('; '),p.status,p.outcome?OUTCOMES[p.outcome.type]:'',p.outcome?.dest||'',p.outcome?fDT(p.outcome.t):'',p.team?.doctor,p.team?.nurse].map(q).join(',')});
  download('mitra911-pasien-'+new Date().toISOString().slice(0,10)+'.csv','﻿'+[h.map(q).join(','),...rows].join('\n'),'text/csv');toast('CSV diunduh')}
function restore(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.patients))throw 0;
  confirmSheet('Pulihkan cadangan?',`File berisi <b>${d.patients.length}</b> pasien. Data saat ini akan diganti.`,'Pulihkan',()=>{const keep={serverUrl:DB.settings.serverUrl,serverKey:DB.settings.serverKey,deviceName:DB.settings.deviceName,sheetUrl:DB.settings.sheetUrl};DB=d;DB.settings=Object.assign({doctor:'',nurse:'',theme:'light',resumeLang:'en',serverUrl:'',serverKey:'',deviceName:'',v2:1},d.settings||{},keep);DB.sync={lastSync:0,lastOk:0,dirty:DB.patients.filter(x=>!x.demo).map(x=>x.id),tomb:[]};buildSnap();persist();applyTheme();toast('Data dipulihkan');render();scheduleSync(500)})}catch(x){toast('File cadangan tidak valid')}};r.readAsText(f)}

/* ---------- toast ---------- */

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('button,[data-open],label');if(!t)return;
  const d=t.dataset;
  if(d.nav)return go(d.nav,{id:null});
  if(d.open)return go('detail',{id:d.open,tab:'ring'});

  if('backDetail' in d)return go('detail',{id:R.id});
  if(d.rlang){DB.settings.resumeLang=d.rlang;save();return render()}
  if(d.themeSet){DB.settings.theme=d.themeSet;save();applyTheme();return render()}

  if(d.deladv&&p){return confirmSheet('Hapus advice?','Advice dokter ini akan dihapus.','Hapus',()=>{const lp=getP(p.id)||p;lp.advice=lp.advice.filter(v=>v.id!==d.deladv);lp.delIds=[...(lp.delIds||[]),d.deladv];save();render()})}
  if(d.delact&&p){return confirmSheet('Hapus tindakan?','Catatan tindakan ini akan dihapus.','Hapus',()=>{const lp=getP(p.id)||p;lp.actions=lp.actions.filter(v=>v.id!==d.delact);lp.delIds=[...(lp.delIds||[]),d.delact];save();render()})}
  if(d.edadv&&p)return advSheet(p,p.advice.find(x=>x.id===d.edadv));
  if(d.edact&&p)return actSheet(p,p.actions.find(x=>x.id===d.edact));
  switch(d.act){
    case 'new':return go('form',{id:null});
    case 'edit':return go('form',{id:R.id});
    case 'report':return go('report',{id:R.id});
    case 'print':return window.print();
    case 'trAuto':return translatePatient(p,false);
    case 'trForce':return translatePatient(p,true);
    case 'srvSave':return connectServer();
    case 'srvPing':return pingServer();
    case 'syncNow':return sync(true);
    case 'srvCopy':{const show=()=>{const ta=$('#srvcode');ta.hidden=false;ta.focus();ta.select();toast('Salin manual teks yang terpilih')};try{navigator.clipboard.writeText(SERVER_CODE).then(()=>toast('Kode Apps Script disalin'),show)}catch(err){show()}return}
    case 'delP':return confirmSheet('Hapus pasien ini?','Data <b>'+esc(p.identity.name)+'</b> beserta TTV, advice, dan tindakannya akan dihapus'+(srv()?' dari perangkat ini dan dari spreadsheet tim':'')+'.','Hapus pasien',()=>{if(MON.id===p.id)stopMon();DB.patients=DB.patients.filter(x=>x.id!==p.id);save();toast('Pasien dihapus');go('list',{id:null})});
    case 'docx':try{exportDocx(buildResume(p,DB.settings.resumeLang||'en'));toast('Laporan Word dibuat')}catch(err){toast('Gagal membuat Word: '+err.message)}return;
    case 'pdf':toast('Menyiapkan PDF…');exportPdf(buildResume(p,DB.settings.resumeLang||'en')).then(()=>toast('Laporan PDF dibuat'),err=>toast('Gagal membuat PDF: '+err.message));return;
    case 'addAdv':return advSheet(p);

    case 'finish':return finishSheet(p);
    case 'reopen':p.status='aktif';p.outcome=null;save();toast('Pasien dibuka kembali');return render();
    case 'monStart':MON.id=p.id;MON.int=+($('#monint')?.value||15);MON.next=Date.now()+MON.int*60000;MON.due=false;beep();toast('Pengingat TTV tiap '+MON.int+' menit aktif');return render();
    case 'monStop':stopMon();return render();
    case 'saveSet':DB.settings.doctor=val('sdoc');DB.settings.nurse=val('snurse');save();toast('Pengaturan tersimpan');return render();
    case 'backup':download('mitra911-cadangan-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(DB),'application/json');return toast('Cadangan diunduh');
    case 'csv':return csv();
    case 'clearDemo':return confirmSheet('Hapus pasien contoh?','Semua data bertanda “Contoh” akan dihapus. Data pasien asli tetap aman.','Hapus contoh',()=>{DB.patients=DB.patients.filter(x=>!x.demo);save();toast('Data contoh dihapus');render()});
    case 'wipe':return confirmSheet('Hapus semua data?','Seluruh data pasien di perangkat ini akan dihapus permanen. Pastikan sudah membuat cadangan.','Hapus semua',()=>{DB.patients=[];SNAP=new Map();DB.sync={lastSync:0,lastOk:0,dirty:[],tomb:[]};persist();stopMon();toast(srv()?'Data lokal dihapus — data tim akan diunduh ulang saat sinkron':'Semua data dihapus');render()});
    case 'install':if(deferredPrompt){deferredPrompt.prompt();deferredPrompt.userChoice.finally(()=>{deferredPrompt=null;render()})}return;
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#ov'))closeSheet();if(e.key==='Enter'&&e.target.matches('[data-open]'))go('detail',{id:e.target.dataset.open,tab:'ring'})});

render();
})();
</script>

<script>if('serviceWorker' in navigator&&location.protocol.startsWith('http')){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}</script>
</body>
